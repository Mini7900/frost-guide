<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101c27"><title>寒霜攻略</title><script type="module">
// Share one fresh load version across the script, styles and guide data.
const version = `${Date.now()}-${crypto.randomUUID()}`;
const assetUrl = path => {
  const url = new URL(path, document.baseURI);
  url.searchParams.set('v', version);
  return url.href;
};
const stylesheet = document.createElement('link');
stylesheet.rel = 'stylesheet';
stylesheet.href = assetUrl('styles.css');
document.head.append(stylesheet);
try {
  await import(assetUrl('app.js'));
} catch (error) {
  const message = document.querySelector('#error');
  message.hidden = false;
  message.textContent = document.querySelector('#language').value === 'en'
    ? 'Unable to load guides. Please try again later.'
    : '攻略暫時無法載入，請稍後再試。';
  console.error(error);
}
</script></head>
